; nectar.ini - the settings of Nectar, the desktop shell (apps/nectar/desktop.py)
; and its launcher (apps/nectar/startmenu.py). Put it next to the program or in
; /sys/settings. UTF-8 (or cp866).
;
; [launcher]  start: the label of the launcher's button; power: the label of
;             the power button at the foot of the launcher's rail (it asks
;             how to end: restart the kernel, shut down, restart)
; [places]    the launcher's rail, top to bottom: title=program|parameters|icon
;             program: a path (relative ones are in /sys, as in menu.dat);
;             icon: a number of /sys/icons16.png (18x18, as in menu.dat);
;             a line "-": a separator. A place whose program is not there is
;             not shown.
; [launcher_ru], [places_ru]: the same on a Russian system.
; [bar]       seconds: the clock shows them (1) or not (0); monitor, sound,
;             network: the notification area shows the system's load, the
;             volume, the network (1, the default) or not (0)
; [pinned]    the programs pinned to the bar, as [places]: the shell writes it
;             (the right button on a window's button: Pin to the bar; a pin
;             dragged along the bar: their order).
; [history]   the Run panel's lines, N=line, the last run first: the shell
;             writes it.
;
; The bar's menu (its right button) has Taskbar Settings: the labels, the
; [bar] keys - and the accent and the text's size, which are kui's own look:
; kui.ini next to the program (or in /sys/settings), [look] accent=emerald,
; sapphire, amethyst, amber or coral, font_size=12..18. They are applied by
; starting the shell again. Its "Make the default shell" writes
; /sys/settings/autorun.dat (Nectar instead of @TASKBAR, @ICON, @DOCKY) and
; makes /sys/@notify pass the system's notifications to Nectar.
;
; The programs are the system's: /sys/settings/menu.dat (@MENU's); the
; desktop's shortcuts and its right-button menu: /sys/settings/icon.ini
; (@ICON's).

[launcher]
start=Menu
power=Shut down

[places]
Computer=File Managers/Eolite|/|61
System=File Managers/Eolite|/sys|50
RAM disk=File Managers/Eolite|/tmp0/1|51
-
Settings=syspanel||60
Processes=cpu||47
-
Documentation=docpack||18
Search=search||49
Run...=run||53

[launcher_ru]
start=Меню
power=Выключение

[places_ru]
Компьютер=File Managers/Eolite|/|61
Система=File Managers/Eolite|/sys|50
RAM-диск=File Managers/Eolite|/tmp0/1|51
-
Настройки=syspanel||60
Процессы=cpu||47
-
Документация=docpack||18
Поиск=search||49
Выполнить...=run||53

[bar]
seconds=0
monitor=1
sound=1
network=1

[pinned]
Eolite=File Managers/Eolite||0

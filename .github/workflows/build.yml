# Builds the programs for KolibriOS with plainpy, runs the tests (in the
# interpreter and compiled) and - for a tag v1.2.3 - publishes the release
# 1.2.3: kolibrios-apps.zip and every program on its own, under the same
# names from release to release, so the latest is always at
# https://github.com/<owner>/<repo>/releases/latest/download/<file>.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # where plainpy comes from: its latest release - or, while it has none, its
  # sources (a private repository needs a PLAINPY_TOKEN secret that can read it)
  PLAINPY_REPO: c4simba/plainpy

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y fasm zip
      - name: plainpy
        env:
          GH_TOKEN: ${{ secrets.PLAINPY_TOKEN || github.token }}
        run: |
          d="$RUNNER_TEMP/plainpy"; mkdir -p "$d"
          if gh release download -R "$PLAINPY_REPO" -p plainpy-linux-x86_64.tar.gz -D "$RUNNER_TEMP"; then
            tar xzf "$RUNNER_TEMP/plainpy-linux-x86_64.tar.gz" -C "$d" --strip-components=1
          else
            echo "$PLAINPY_REPO has no release: building plainpy from its sources"
            gh repo clone "$PLAINPY_REPO" "$RUNNER_TEMP/plainpy-src" -- --depth 1
            make -C "$RUNNER_TEMP/plainpy-src" -j"$(nproc)"
            make -C "$RUNNER_TEMP/plainpy-src" install PREFIX="$d"
          fi
          echo "$d/bin" >> "$GITHUB_PATH"
      - name: plainpy's version
        run: plainpy --version
      - name: Tests (interpreter)
        run: make test TARGET=interp
      - name: Tests (compiled)
        run: make test
      - name: The programs for KolibriOS
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: kolibrios-apps
          path: build/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kolibrios-apps
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" \
             --generate-notes dist/*
